{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h2 class="mb-4">{% if object %}Modifier l'offre{% else %}Nouvelle offre{% endif %}</h2>

  <div class="card p-4" style="max-width: 640px;">
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <div class="d-flex gap-2 mt-2">
        <a href="{% url 'offers:catalogue' %}" class="btn btn-outline-dark">Annuler</a>
        <button type="submit" class="btn btn-accent">Enregistrer</button>
      </div>
    </form>
  </div>
{% endblock %}
