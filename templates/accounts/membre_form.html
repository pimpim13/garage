{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h2 class="mb-4">Nouveau membre</h2>

  <div class="card p-4" style="max-width: 640px;">
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button type="submit" class="btn btn-accent mt-2">Créer le membre</button>
    </form>
  </div>
{% endblock %}
