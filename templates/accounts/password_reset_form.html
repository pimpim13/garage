{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-5">
      <div class="card p-4">
        <h2 class="mb-3">Mot de passe oublié</h2>
        <p class="text-muted mb-3">
          Indiquez votre adresse email, nous vous enverrons un lien pour choisir un nouveau mot de passe.
        </p>
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-accent w-100 mt-2">Envoyer le lien</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
